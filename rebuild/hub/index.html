const HUB_DESCRIPTION="A central starting point for every new player that passes into the overworld. The place where perhaps you fell asleep, or put on a pair of panties that didn't belong to you. Perhaps one of the simplest and most peaceful location in the overworld. It's probably a good thing that there are no secrets or discoveries to be made at this location.";
save.attributes=save.attributes||{};for(const [oldKey,newKey] of [['Empathy / Insight','Insight'],['Influence / Intimidation','Influence']]){if(Object.prototype.hasOwnProperty.call(save.attributes,oldKey)){if(!Object.prototype.hasOwnProperty.call(save.attributes,newKey))save.attributes[newKey]=save.attributes[oldKey];delete save.attributes[oldKey];}}save.hub=save.hub||{};if(!save.hub.location||save.hub.location==='hub')save.hub.location='Central Hub';save.hub.description=save.hub.description||HUB_DESCRIPTION;save.hub.discoveredNPCs=Array.from(new Set([...(save.hub.discoveredNPCs||[]),'Eve']));save.hub.feed=save.hub.feed||[];const CHERISHED_DESCRIPTION="Cherished Touch is a single-story clothing store northeast of Central Hub. A sign marks the storefront above large display windows, with basic apparel and a Help Wanted sign. Inside, shelves display an eclectic selection of items. Charity, the manager known as the gifted gabber, is usually behind the counter. A curtain behind the counter leads toward a private hallway and backrooms.";
const CHERISHED_INTRO="Welcome to Cherished Touch Clothing store. Mystery items are available for gamblers; Cherished Touch holds no responsibility and accepts no returns.";
save.world=save.world||{};save.world.discovered=save.world.discovered||{};save.world.visited=save.world.visited||{};save.world.npcsDiscovered=save.world.npcsDiscovered||{};
if(save.hub.location==='Cherished Touch')save.world.visited.cherishedTouch=true;
const FIRST_STEPS_DETAILS={id:'first_steps',title:'First Steps',description:'Speak to Eve at Central Hub to accept the quest. Survey nearby routes, travel northeast to Cherished Touch, explore the store, then return to Central Hub and SPEAK TO EVE AGAIN to report your findings and claim your reward.',rewards:'100 gold · 50 EXP',location:'Central Hub → Cherished Touch → Central Hub'};
function firstStepsRecord(){save.quests=save.quests||{};return save.quests.firstSteps=save.quests.firstSteps||{status:'available',rewarded:false};}
function syncCompletedQuestJournal(){const q=firstStepsRecord();save.quests.journal=save.quests.journal||{completed:[]};save.quests.journal.completed=Array.isArray(save.quests.journal.completed)?save.quests.journal.completed:[];if(q.status==='completed'&&!save.quests.journal.completed.some(x=>x.id===FIRST_STEPS_DETAILS.id)){save.quests.journal.completed.push({...FIRST_STEPS_DETAILS,completedAt:q.completedAt||null});store();}}
function completedJournalMarkup(){syncCompletedQuestJournal();const entries=save.quests.journal.completed;return '<div class="eyebrow">EPI-CENTER // JOURNAL</div><h1 class="title">Journal</h1><section class="card"><h2>Completed Quests</h2>'+(entries.length?entries.map(x=>'<details class="journal-entry"><summary>'+htmlEscape(x.title)+'</summary><p>'+htmlEscape(x.description)+'</p><p>Route: '+htmlEscape(x.location)+'</p><p>Rewards: '+htmlEscape(x.rewards)+'</p><p>Completed: '+htmlEscape(x.completedAt?new Date(x.completedAt).toLocaleString():'Timestamp unavailable — completed before journal tracking')+'</p></details>').join(''):'<p>No completed quests yet.</p>')+'</section>';}
function questDrawerMarkup(){syncCompletedQuestJournal();const q=firstStepsRecord(),done=q.status==='completed';const status=done?'Completed — archived in Journal':q.status==='active'?(save.world.visited.cherishedTouch?'Return to Central Hub and speak to Eve to report back and claim your reward.':'Travel to Cherished Touch, explore it, then return to Eve at Central Hub to report back.'):'Available — speak to Eve at Central Hub to accept';return '<section>'+(done?'<p>No active quests. First Steps is in your completed quest journal.</p>':'<h3>First Steps</h3><p>'+htmlEscape(FIRST_STEPS_DETAILS.description)+'</p><p><strong>Next objective:</strong> '+htmlEscape(status)+'</p><p>Rewards: '+htmlEscape(FIRST_STEPS_DETAILS.rewards)+'</p>')+'</section><button class="btn secondary" data-info="journal">Completed Journal</button>';}

function talkEve(){const q=save.quests=save.quests||{};const first=q.firstSteps=q.firstSteps||{status:'available',rewarded:false};if(first.status==='available'){first.status='active';feedEntry('Eve','Welcome! Survey nearby routes, travel northeast to Cherished Touch, then return to me. First Steps accepted.');}else if(first.status==='active'&&save.world.visited.cherishedTouch&&save.hub.location==='Central Hub'){first.status='completed';first.completedAt=first.completedAt||new Date().toISOString();if(!first.rewarded){save.gold=Number(save.gold||0)+100;save.exp=Number(save.exp||0)+50;first.rewarded=true;}syncCompletedQuestJournal();feedEntry('Eve','First Steps complete. You earned 100 gold and 50 EXP.');}else feedEntry('Eve',first.status==='completed'?'You completed First Steps.':'Explore Cherished Touch and return to me.');}function atCherished(){return save.hub.location==='Cherished Touch';}
function locationDescription(){return atCherished()?CHERISHED_DESCRIPTION:HUB_DESCRIPTION;}
function knownNPCs(){return atCherished()?(save.world.npcsDiscovered.Charity?['Charity']:[]):['Eve'];}
function surveyRoutes(){if(save.hub.location!=='Central Hub'){feedEntry('World','No new overworld routes discovered here.');return;}if(!save.world.discovered.cherishedTouch){save.world.discovered.cherishedTouch=true;feedEntry('World','You discover Cherished Touch to the northeast of Central Hub. Open Path and travel northeast.');}else feedEntry('World','Cherished Touch remains visible to the northeast.');}
function travelCherished(){if(save.hub.location!=='Central Hub'||!save.world.discovered.cherishedTouch)return;save.hub.location='Cherished Touch';save.world.visited.cherishedTouch=true;feedEntry('World','You arrive at Cherished Touch. '+CHERISHED_DESCRIPTION);render();}
const OVERWORLD_ROUTES=[{from:'Central Hub',to:'Cherished Touch',direction:'NE',returnDirection:'SW',discovery:'cherishedTouch'}];
function availablePathRoutes(){const loc=save.hub.location;const result=[];for(const route of OVERWORLD_ROUTES){if(!save.world.discovered[route.discovery]&&loc!==route.to)continue;if(loc===route.from)result.push({id:route.to,direction:route.direction,name:route.to});if(loc===route.to)result.push({id:route.from,direction:route.returnDirection,name:route.from});}return result;}
function travelPath(destination){const route=availablePathRoutes().find(x=>x.id===destination);if(!route){feedEntry('World','That destination is not a discovered, directly connected route.');render();return;}save.hub.location=route.id;if(route.id==='Cherished Touch')save.world.visited.cherishedTouch=true;feedEntry('World','You travel '+route.direction+' to '+route.name+'.');render();}

function devAction(action){const d=devState(),amount=Number(document.getElementById('devAmount')?.value),minutes=Number(document.getElementById('devMinutes')?.value);if(action==='time'){if(!Number.isFinite(minutes)||minutes<0||minutes>100000)return 'Enter 0–100000 minutes.';d.minutes+=minutes;for(const k of Object.keys(DEV_NEEDS_RATES))d.needs[k]=devClamp(d.needs[k]+minutes*DEV_NEEDS_RATES[k],0,100);save.hub.gameTime='Simulated '+d.minutes.toFixed(0)+' min';}

const input=document.getElementById('actionInput'),recipient=document.getElementById('recipientInput'),recipientSelect=document.getElementById('recipientSelect'),recipientRow=document.getElementById('recipientRow');save.hub.channel=save.hub.channel||'world';input.value=save.hub.actionDraft||'';recipient.value=save.hub.recipientDraft||'';function updateChannel(){recipientRow.hidden=!['npc','players'].includes(save.hub.channel);document.querySelectorAll('[data-channel]').forEach(b=>b.classList.toggle('active',b.dataset.channel===save.hub.channel));}function refreshRecipients(){const options=save.hub.channel==='npc'?(atCherished()?[['npc:charity','Charity']]:[['npc:eve','Eve']]):save.hub.channel==='players'?[['player:self:'+slot,save.name+' (local character)']]:[];const selected=save.hub.recipientId||'';recipientSelect.replaceChildren();const first=document.createElement('option');first.value='';first.textContent='Select recipient';recipientSelect.append(first);for(const [id,name] of options){if(recipient.value.trim()&&!name.toLowerCase().includes(recipient.value.trim().toLowerCase()))continue;const o=document.createElement('option');o.value=id;o.textContent=name;recipientSelect.append(o);}recipientSelect.value=options.some(([id])=>id===selected)?selected:'';if(!recipientSelect.value)save.hub.recipientId='';}refreshRecipients();recipientSelect.addEventListener('change',()=>{save.hub.recipientId=recipientSelect.value;const chosen=[...recipientSelect.options].find(o=>o.value===recipientSelect.value);if(chosen&&chosen.value){recipient.value=chosen.textContent.replace(' (local character)','');save.hub.recipientDraft=recipient.value;}store();});document.querySelectorAll('[data-channel]').forEach(b=>b.addEventListener('click',()=>{save.hub.channel=b.dataset.channel;save.hub.recipientId='';save.hub.recipientDraft='';recipient.value='';store();updateChannel();refreshRecipients();}));input.addEventListener('input',()=>{save.hub.actionDraft=input.value;store();});recipient.addEventListener('input',()=>{save.hub.recipientDraft=recipient.value;save.hub.recipientId='';store();refreshRecipients();const matching=[...recipientSelect.options].find(o=>o.value&&o.textContent.toLowerCase()===recipient.value.trim().toLowerCase());if(matching){save.hub.recipientId=matching.value;recipientSelect.value=matching.value;store();}});document.getElementById('compose').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;if(['npc','players'].includes(save.hub.channel)&&!save.hub.recipientId){recipientSelect.focus();return;}if(save.hub.channel==='npc'&&!atCherished()&&save.hub.recipientId==='npc:eve'){feedEntry(save.name+' → Eve',text);talkEve();save.hub.actionDraft='';store();render();return;}if(save.hub.channel==='npc'&&atCherished()&&save.hub.recipientId==='npc:charity'){feedEntry(save.name+' → Charity',text);interactCharity(text);save.hub.actionDraft='';store();render();return;}const who=save.name+' · '+({world:'Location',npc:'NPC',players:'Player',form:'Form'})[save.hub.channel]+(recipient.value.trim()?' → '+recipient.value.trim():'');feedEntry(who,text);save.hub.actionDraft='';store();render();});document.getElementById('openHubArt')?.addEventListener('click',showHubArtwork);app.querySelectorAll('[data-drawer]').forEach(b=>b.addEventListener('click',()=>openDrawer(b.dataset.drawer)));}
