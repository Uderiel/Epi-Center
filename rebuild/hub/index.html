<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EPI-CENTER v1.0.7 — Hub UI baseline</title><style>
:root{--bg:#080f1b;--panel:#111d2c;--panel2:#18283a;--line:#2a4558;--cyan:#70e6ed;--mint:#b2f3c8;--gold:#f5c875;--red:#ff8496;--text:#e6f3f6;--muted:#96afbc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1080px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:5;background:#091522f5;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{letter-spacing:2px;color:var(--cyan);font-weight:900;font-size:18px}.sub{font-size:10px;letter-spacing:1.6px;color:var(--muted)}.online{color:var(--mint);font-size:11px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);flex:1}.side{padding:16px;border-right:1px solid var(--line);background:#0b1624}.nav{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--muted);padding:12px;margin:3px 0}.nav.active,.nav:hover{background:var(--panel2);border-color:var(--line);color:var(--cyan)}.sidefoot{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.7}.main{min-width:0;padding:20px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px;text-transform:uppercase}.title{font-size:clamp(23px,4vw,34px);margin:8px 0 12px}.muted{color:var(--muted);line-height:1.6}.hero{position:relative;overflow:hidden;border-radius:18px;min-height:250px;border:1px solid #426277;background:radial-gradient(ellipse at 50% 50%,#68e5ea55,transparent 19%),radial-gradient(ellipse at 50% 85%,#0d6970,transparent 50%),linear-gradient(140deg,#0a1727,#253b55 55%,#0a1422);display:flex;align-items:flex-end}.hero:before{content:'';position:absolute;left:46%;bottom:12%;width:9%;height:78%;clip-path:polygon(50% 0,75% 16%,66% 100%,34% 100%,25% 16%);background:linear-gradient(90deg,#294963,#c3ffff,#285e74);box-shadow:0 0 40px #70e6ed}.hero:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 72px,#9eeeff10 73px 75px),linear-gradient(transparent 30%,#06101dc9);pointer-events:none}.hero.forest{background:radial-gradient(circle at 60% 25%,#c4e7b66b,transparent 30%),repeating-linear-gradient(110deg,#132c25 0 32px,#244c40 33px 57px,#101e20 58px 80px)}.hero.under{background:radial-gradient(ellipse at 45% 70%,#ad55c06e,transparent 40%),repeating-linear-gradient(125deg,#20132b 0 45px,#42274e 48px 72px,#140f22 75px 95px)}.hero.lab{background:repeating-linear-gradient(90deg,#142e3d 0 60px,#294b58 62px 70px,#10202c 72px 110px);}.hero.city{background:radial-gradient(circle at 65% 35%,#e66c5a65,transparent 32%),repeating-linear-gradient(90deg,#142131 0 30px,#293447 30px 60px,#111c2c 60px 75px)}.hero-content{z-index:1;position:relative;padding:20px;width:100%}.hero h2{font-size:27px;margin:5px 0}.tag{display:inline-block;border:1px solid #4d7788;background:#0b2336bb;color:var(--cyan);font-size:10px;letter-spacing:1px;padding:5px 9px;border-radius:100px}.danger{color:var(--red);border-color:#8c4257}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0}.card h3{margin:0 0 8px;font-size:15px}.stat{font-size:26px;font-weight:800;color:var(--cyan)}.btn{border:1px solid #477b89;background:#123747;color:var(--cyan);padding:11px 13px;border-radius:9px;font-weight:700}.btn:hover{background:#1c5060}.btn.secondary{background:var(--panel2);color:var(--text);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.listitem{border-top:1px solid var(--line);padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.listitem:first-child{border-top:0}.small{font-size:12px}.chatlog{height:270px;overflow:auto;background:#08131e;border:1px solid var(--line);border-radius:11px;padding:12px;margin:10px 0}.msg{padding:9px 0;border-bottom:1px solid #263949}.msg:last-child{border-bottom:0}.msg b{color:var(--cyan)}.msg.system b{color:var(--gold)}.chatbar{display:flex;gap:8px}.chatbar input,.nameinput,.field{background:#08131e;border:1px solid #345369;color:var(--text);border-radius:9px;padding:12px;min-width:0;flex:1}.progress{height:9px;border-radius:99px;background:#263848;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#319aa8,#9af3e1)}.mapnode{width:100%;display:block;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0}.mapnode:hover{border-color:var(--cyan)}.locked{opacity:.5}.foot{padding:12px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#214458;color:white;border:1px solid var(--cyan);padding:12px 16px;border-radius:12px;z-index:10;max-width:90vw;display:none}.mobile-nav{display:none}@media(max-width:720px){.layout{display:block}.side{display:none}.main{padding:14px 14px 92px}.grid{gap:9px}.card{padding:12px}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:6;background:#091522;border-top:1px solid var(--line);padding:7px 4px max(7px,env(safe-area-inset-bottom))}.mobile-nav button{background:transparent;border:0;color:var(--muted);font-size:10px;padding:6px 1px}.mobile-nav button.active{color:var(--cyan)}.mobile-nav .ico{display:block;font-size:21px;margin-bottom:3px}.hero{min-height:225px}.hero h2{font-size:23px}}

.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.profile-grid label{display:block;color:var(--muted);font-size:12px}.field{width:100%;margin-top:5px}.meter{height:10px;border-radius:12px;background:#243747;overflow:hidden;margin:5px 0 13px}.meter>span{display:block;height:100%;background:var(--mint)}.meter.mental>span{background:var(--cyan)}.meter.arousal>span{background:var(--gold)}.statrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.statrow button{min-width:38px}.logline{border-bottom:1px solid var(--line);padding:9px 0;line-height:1.5}.warning{border-color:var(--red)}@media(max-width:720px){.profile-grid{grid-template-columns:1fr}.mobile-nav{grid-template-columns:repeat(6,1fr)}.mobile-nav button{font-size:9px}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">◈ EPI-CENTER</div><div class="sub">A.S.S. // ADAPTIVE SUPPORT SYSTEM</div></div><div class="online">● SYSTEM ONLINE<br><span id="topName" style="color:#96afbc">GUEST CONNECTION</span></div></header><div class="layout"><aside class="side"><div class="eyebrow">Navigation</div><div id="sideNav"></div><div class="sidefoot">NEURAL LINK: STABLE<br>SESSION: LOCAL SAVE<br>BUILD: v1.0.7</div></aside><main class="main" id="app"></main></div><footer class="foot">EPI-CENTER // Build v1.0.7 • UI baseline adapted from v0.8.84 • Saved on this device only</footer></div><nav class="mobile-nav" id="mobileNav"></nav><script>
const slot=Number(new URLSearchParams(location.search).get('slot')),key='epicenter_v1_slot_'+slot;
const tabs=[['hub','⌂','Hub'],['map','◇','Map'],['character','♙','Character'],['inventory','▣','Items'],['power','ϟ','Power'],['encounter','⚄','Encounter']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let save;try{if(!Number.isInteger(slot)||slot<1||slot>3)throw Error('Invalid slot');save=JSON.parse(localStorage.getItem(key)||'null');if(!save||save.slot!==slot||save.status!=='ready')throw Error('No confirmed character in this slot');}catch(e){document.getElementById('app').textContent=e.message+' — Return to title screen to select a character.';throw e;}
document.getElementById('topName').textContent=save.name||'CHARACTER';
let screen='hub';function nav(){for(const id of ['sideNav','mobileNav']){const node=document.getElementById(id);node.replaceChildren();for(const [name,symbol,label] of tabs){const b=document.createElement('button');b.className=(id==='sideNav'?'nav ':'')+(screen===name?'active':'');if(id==='mobileNav'){const ico=document.createElement('span');ico.className='ico';ico.textContent=symbol;b.append(ico);}b.append(document.createTextNode((id==='sideNav'?symbol+'  ':'')+label));b.addEventListener('click',()=>{screen=name;render();});node.append(b);}}}
function render(){nav();const app=document.getElementById('app'),a=save.attributes||{},appearance=save.appearance||{};let body='';
if(screen==='hub')body='<div class="eyebrow">NEURAL INTERFACE // ACTIVE</div><h1 class="title">Welcome to Epi-Center</h1><div class="hero"><div class="hero-content"><span class="tag">CENTRAL HUB</span><h2>The Spire</h2><p>Overworld • Central Hub</p></div></div><p class="muted">Your starting point in Epi-Center. This v0.8.84 interface baseline is ready for redesign; legacy world actions are not yet connected.</p><div class="grid"><div class="card"><div class="eyebrow">Connected identity</div><h3>'+esc(save.name)+'</h3><div class="muted small">Save slot '+slot+'</div></div><div class="card"><div class="eyebrow">World progression</div><h3>Hub Cylinders</h3><div class="stat">0 <span class="small muted">retrieved</span></div></div></div><div class="card"><h3>◈ A.S.S. System Message</h3><p class="muted" id="eveMessage"></p></div>';
else if(screen==='character')body='<div class="eyebrow">IDENTITY // RECORD</div><h1 class="title">'+esc(save.name)+'</h1><div class="grid">'+Object.entries(a).map(([k,v])=>'<div class="card"><h3>'+esc(k)+'</h3><div class="stat">'+esc(v)+'</div></div>').join('')+'</div><section class="card"><h3>Original appearance</h3>'+Object.entries(appearance).filter(([k,v])=>String(v).trim()).map(([k,v])=>'<div class="listitem"><b>'+esc(k)+'</b><span>'+esc(v)+'</span></div>').join('')+'</section>';
else body='<div class="eyebrow">EPI-CENTER // '+esc(screen.toUpperCase())+'</div><h1 class="title">'+esc(tabs.find(x=>x[0]===screen)[2])+'</h1><div class="card"><h3>v0.8.84 interface baseline</h3><p class="muted">This tab is preserved for interface redesign. Its legacy gameplay logic has not yet been migrated into the 1.0 save system.</p></div>';
app.innerHTML=body+'<div class="actions"><button class="btn secondary" id="returnTitle">Return to title screen</button></div>';
document.getElementById('returnTitle').addEventListener('click',()=>location.assign('../title-screen/?v=1.0.7'));
const msg=document.getElementById('eveMessage');if(msg)msg.textContent=save.eve?.feed?.[0]?.text||'Welcome to Epi-Center. I am Eve, your Automated Support System custodian.';
}
render();
</script></body></html>
