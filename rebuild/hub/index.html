<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EPI-CENTER v1.0.16 — Hub UI baseline</title><style>
:root{--bg:#080f1b;--panel:#111d2c;--panel2:#18283a;--line:#2a4558;--cyan:#70e6ed;--mint:#b2f3c8;--gold:#f5c875;--red:#ff8496;--text:#e6f3f6;--muted:#96afbc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1080px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{position:sticky;top:0;z-index:5;background:#091522f5;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{letter-spacing:2px;color:var(--cyan);font-weight:900;font-size:18px}.sub{font-size:10px;letter-spacing:1.6px;color:var(--muted)}.online{color:var(--mint);font-size:11px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);flex:1}.side{padding:16px;border-right:1px solid var(--line);background:#0b1624}.nav{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--muted);padding:12px;margin:3px 0}.nav.active,.nav:hover{background:var(--panel2);border-color:var(--line);color:var(--cyan)}.sidefoot{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.7}.main{min-width:0;padding:20px}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px;text-transform:uppercase}.title{font-size:clamp(23px,4vw,34px);margin:8px 0 12px}.muted{color:var(--muted);line-height:1.6}.hero{position:relative;overflow:hidden;border-radius:18px;min-height:250px;border:1px solid #426277;background:radial-gradient(ellipse at 50% 50%,#68e5ea55,transparent 19%),radial-gradient(ellipse at 50% 85%,#0d6970,transparent 50%),linear-gradient(140deg,#0a1727,#253b55 55%,#0a1422);display:flex;align-items:flex-end}.hero:before{content:'';position:absolute;left:46%;bottom:12%;width:9%;height:78%;clip-path:polygon(50% 0,75% 16%,66% 100%,34% 100%,25% 16%);background:linear-gradient(90deg,#294963,#c3ffff,# kground:#08131e;border:1px solid var(--line);border-radius:11px;padding:12px;margin:10px 0}.msg{padding:9px 0;border-bottom:1px solid #263949}.msg:last-child{border-bottom:0}.msg b{color:var(--cyan)}.msg.system b{color:var(--gold)}.chatbar{display:flex;gap:8px}.chatbar input,.nameinput,.field{background:#08131e;border:1px solid #345369;color:var(--text);border-radius:9px;padding:12px;min-width:0;flex:1}.progress{height:9px;border-radius:99px;background:#263848;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#319aa8,#9af3e1)}.mapnode{width:100%;display:block;text-align:left;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0}.mapnode:hover{border-color:var(--cyan)}.locked{opacity:.5}.foot{padding:12px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#214458;color:white;border:1px solid var(--cyan);padding:12px 16px;border-radius:12px;z-index:10;max-width:90vw;display:none}.mobile-nav{display:none}@media(max-width:720px){.layout{display:block}.side{display:none}.main{padding:14px 14px 92px}.grid{gap:9px}.card{padding:12px}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:6;background:#091522;border-top:1px solid var(--line);padding:7px 4px max(7px,env(safe-area-inset-bottom))}.mobile-nav button{background:transparent;border:0;color:var(--muted);font-size:10px;padding:6px 1px}.mobile-nav button.active{color:var(--cyan)}.mobile-nav .ico{display:block;font-size:21px;margin-bottom:3px}.hero{min-height:225px}.hero h2{font-size:23px}}

.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.profile-grid label{display:block;color:var(--muted);font-size:12px}.field{width:100%;margin-top:5px}.meter{height:10px;border-radius:12px;background:#243747;overflow:hidden;margin:5px 0 13px}.meter>span{display:block;height:100%;background:var(--mint)}.meter.mental>span{background:var(--cyan)}.meter.arousal>span{background:var(--gold)}.statrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.statrow button{min-width:38px}.logline{border-bottom:1px solid var(--line);padding:9px 0;line-height:1.5}.warning{border-color:var(--red)}@media(max-width:720px){.profile-grid{grid-template-columns:1fr}.mobile-nav{grid-template-columns:repeat(6,1fr)}.mobile-nav button{font-size:9px}}
body .v882-shell{display:flex;flex-direction:column;gap:9px;max-width:900px;margin:auto;padding-bottom:90px}.v882-head{background:#10283b;border:1px solid #356075;border-radius:10px;padding:10px}.v882-head strong{font-size:20px}.v882-head small{display:block;color:#9ab8c5}.v882-tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.v882-tools button{font-size:11px;padding:11px 1px;min-width:0;background:#18384a;color:#d5f5f5;border:1px solid #46758a;border-radius:8px}.v882-feed .v815{display:flex;flex-direction:column;gap:9px}.v815-live{min-height:180px;max-height:46dvh;overflow:auto;border:1px solid #3c6074;border-radius:10px;padding:12px}.v815-status{color:#b2f3c8}.v815-compose{position:sticky;bottom:67px;z-index:10;background:#0c2132;border:1px solid #3c6074;border-radius:10px;padding:9px}.v815-compose label{display:block;margin-bottom:5px}.v815-compose textarea{display:block;width:100%;min-height:52px;background:#08131e;color:white;border:1px solid #345369;border-radius:9px;padding:10px;margin-bottom:7px}.v882-shade{position:fixed;inset:0;z-index:150;background:#000b;display:flex}.v882-shade article{width:min(88vw,360px);height:100%;overflow:auto;background:#11293c;border-right:2px solid #70e6ed;padding:18px}@media(min-width:700px){.v815-live{max-height:57dvh}.v815-compose{bottom:10px}} .v815-channels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:9px}.v815-channels button{background:#18384a;border:1px solid #46758a;border-radius:8px;color:#d5f5f5;min-width:0;padding:9px 2px;font-size:12px}.v815-channels button.active{background:#21637b;border-color:#70e6ed;color:#fff}@media(max-width:720px){.mobile-nav{display:flex;overflow-x:auto;grid-template-columns:none;scrollbar-width:thin}.mobile-nav button{flex:0 0 68px}}  .v882-shell{height:calc(100dvh - 170px);min-height:440px;padding-bottom:0!important}.v882-feed{flex:1;min-height:0;display:flex;flex-direction:column}.v882-feed>.v815{flex:1;min-height:0}.v815-live{flex:1;min-height:120px;max-height:none!important;overflow-y:auto}.v815-compose{position:fixed!important;left:50%;transform:translateX(-50%);bottom:calc(65px + env(safe-area-inset-bottom));width:min(calc(100% - 28px),870px);z-index:20;box-shadow:0 -5px 22px #000b}.v815-input{display:flex;gap:7px;align-items:flex-end}.v815-input-label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.v815-input textarea{flex:1;min-width:0;margin:0}.v815-input button{flex:0 0 auto;white-space:nowrap}.v815-history{margin-bottom:200px}@media(min-width:721px){.v815-compose{bottom:12px;left:calc(50% + 115px);width:min(calc(100% - 280px),850px)}.v882-shell{height:calc(100dvh - 130px)}}@media(max-width:720px){.v882-shell{height:calc(100dvh - 155px)}.v815-channels button{min-height:38px}.v815-compose{padding:7px}} .location-image{height:105px;border:1px solid var(--line);border-radius:8px;margin-top:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:linear-gradient(135deg,#101b2a,#263c4e)}.v882-shell{height:auto!important;min-height:0!important;padding-bottom:0!important}.v882-feed{min-height:0}.v815-live{height:clamp(180px,37dvh,440px);flex:none!important;max-height:none!important;overflow-y:auto}.v815-compose{position:fixed!important;bottom:calc(65px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),870px);z-index:20}.v815-history{margin-bottom:210px}.recipient-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.recipient-row[hidden]{display:none}.recipient-row input{min-width:0;flex:1;background:#08131e;color:white;border:1px solid #345369;border-radius:7px;padding:8px}.compass{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.compass-cell{border:1px solid var(--line);padding:7px;min-height:70px;overflow-wrap:anywhere}.compass-cell small{color:var(--cyan)}.stat-detail{border-bottom:1px solid var(--line);padding:9px 0}.stat-detail summary{display:flex;justify-content:space-between;cursor:pointer}.v882-shade article{width:min(92vw,440px)}@media(min-width:721px){.v815-compose{left:calc(50% + 115px);width:min(calc(100% - 280px),850px);bottom:12px}}@media(max-width:720px){.v882-head{padding:8px}.location-image{height:90px}.v815-live{height:clamp(170px,33dvh,380px)}}</style></head><body><div class="shell"><header class="top"><div><div class="brand">◈ EPI-CENTER</div><div class="sub">A.S.S. // ADAPTIVE SUPPORT SYSTEM</div></div><div class="online">● SYSTEM ONLINE<br><span id="topName" style="color:#96afbc">GUEST CONNECTION</span></div></header><div class="layout"><aside class="side"><div class="eyebrow">Navigation</div><div id="sideNav"></div><div class="sidefoot">NEURAL LINK: STABLE<br>SESSION: LOCAL SAVE<br>BUILD: v1.0.16</div></aside><main class="main" id="app"></main></div><footer class="foot">EPI-CENTER // Build v1.0.16 • UI baseline adapted from v0.8.84 • Saved on this device only</footer></div><nav class="mobile-nav" id="mobileNav"></nav><script>
const slot=Number(new URLSearchParams(location.search).get('slot')),key='epicenter_v1_slot_'+slot;
const tabs=[['play','▶','Play'],['map','◇','Map'],['character','♙','Character'],['equipment','♧','Equip'],['inventory','▣','Items'],['power','ϟ','Power'],['settings','⚙','Settings'],['builder','▤','Builder']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let save;try{if(!Number.isInteger(slot)||slot<1||slot>3)throw Error('Invalid slot');save=JSON.parse(localStorage.getItem(key)||'null');if(!save||save.slot!==slot||save.status!=='ready')throw Error('No confirmed character in this slot');}catch(e){document.getElementById('app').textContent=e.message+' — Return to title screen to select a character.';throw e;}
document.getElementById('topName').textContent=save.name||'CHARACTER';
const HUB_DESCRIPTION="A central starting point for every new player that passes into the overworld. The place where perhaps you fell asleep, or put on a pair of panties that didn't belong to you. Perhaps one of the simplest and most peaceful location in the overworld. It's probably a good thing that there are no secrets or discoveries to be made at this location.";
save.attributes=save.attributes||{};for(const [oldKey,newKey] of [['Empathy / Insight','Insight'],['Influence / Intimidation','Influence']]){if(Object.prototype.hasOwnProperty.call(save.attributes,oldKey)){if(!Object.prototype.hasOwnProperty.call(save.attributes,newKey))save.attributes[newKey]=save.attributes[oldKey];delete save.attributes[oldKey];}}save.hub=save.hub||{};if(!save.hub.location||save.hub.location==='hub')save.hub.location='Central Hub';save.hub.description=save.hub.description||HUB_DESCRIPTION;save.hub.discoveredNPCs=Array.from(new Set([...(save.hub.discoveredNPCs||[]),'Eve']));save.hub.feed=save.hub.feed||[];const CHERISHED_DESCRIPTION="Cherished Touch is a single-story clothing store northeast of Central Hub. A sign marks the storefront above large display windows, with basic apparel and a Help Wanted sign. Inside, shelves display an eclectic selection of items. Charity, the manager known as the gifted gabber, is usually behind the counter. A curtain behind the counter leads toward a private hallway and backrooms.";
const CHERISHED_INTRO="Welcome to Cherished Touch Clothing store. Mystery items are available for gamblers; Cherished Touch holds no responsibility and accepts no returns.";
save.world=save.world||{};save.world.discovered=save.world.discovered||{};save.world.visited=save.world.visited||{};save.world.npcsDiscovered=save.world.npcsDiscovered||{};
if(save.hub.location==='Cherished Touch')save.world.visited.cherishedTouch=true;
function atCherished(){return save.hub.location==='Cherished Touch';}
function locationDescription(){return atCherished()?CHERISHED_DESCRIPTION:HUB_DESCRIPTION;}
function knownNPCs(){return atCherished()?(save.world.npcsDiscovered.Charity?['Charity']:[]):['Eve'];}
function surveyRoutes(){if(save.hub.location!=='Central Hub'){feedEntry('World','No new overworld routes discovered here.');return;}if(!save.world.discovered.cherishedTouch){save.world.discovered.cherishedTouch=true;feedEntry('World','You discover Cherished Touch to the northeast of Central Hub. Open Path and travel northeast.');}else feedEntry('World','Cherished Touch remains visible to the northeast.');}
function travelCherished(){if(save.hub.location!=='Central Hub'||!save.world.discovered.cherishedTouch)return;save.hub.location='Cherished Touch';save.world.visited.cherishedTouch=true;feedEntry('World','You arrive at Cherished Touch. '+CHERISHED_DESCRIPTION);render();}
function travelHub(){if(!atCherished())return;save.hub.location='Central Hub';feedEntry('World','You return southwest to Central Hub.');render();}
function interactCharity(message){if(!atCherished())return false;if(!save.world.npcsDiscovered.Charity){save.world.npcsDiscovered.Charity=true;feedEntry('World','You meet Charity, the manager of Cherished Touch. Charity is now a discovered NPC.');}feedEntry('Charity',CHERISHED_INTRO);return true;}
save.baselines=save.baselines||{};for(const [k,v] of Object.entries({health:100,stamina:100,arousal:0}))if(save.baselines[k]===undefined&&save.stats?.[k]===undefined&&save[k]===undefined)save.baselines[k]=v;localStorage.setItem(key,JSON.stringify(save));
let screen='play';let loggingOut=false;history.replaceState({epiHubBase:true},'',location.href);history.pushState({epiHubGuard:true},'',location.href);window.addEventListener('popstate',()=>{if(loggingOut)return;const drawer=document.getElementById('drawer882');if(drawer){drawer.remove();}else if(screen!=='play'){screen='play';render();}else{const notice=document.getElementById('backNotice');if(notice){notice.textContent='To leave Epi-Center, open Settings and select Log Out.';}else{const p=document.createElement('div');p.id='backNotice';p.setAttribute('role','status');p.textContent='To leave Epi-Center, open Settings and select Log Out.';document.getElementById('app')?.prepend(p);}}history.pushState({epiHubGuard:true},'',location.href);});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('drawer882')){e.preventDefault();closeDrawer();}});function closeDrawer(){document.getElementById('drawer882')?.remove();}function logout(){store();loggingOut=true;location.replace('../title-screen/?v=1.0.16');}function nav(){for(const id of ['sideNav','mobileNav']){const node=document.getElementById(id);node.replaceChildren();for(const [name,symbol,label] of tabs){const b=document.createElement('button');b.className=(id==='sideNav'?'nav ':'')+(screen===name?'active':'');if(id==='mobileNav'){const ico=document.createElement('span');ico.className='ico';ico.textContent=symbol;b.append(ico);}b.append(document.createTextNode((id==='sideNav'?symbol+'  ':'')+label));b.addEventListener('click',()=>{screen=name;render();});node.append(b);}}}

const ATTRS=['Endurance','Fitness','Intuition','Reflexes','Willpower','Reasoning','Stability','Presence','Insight','Influence'];
const DIRECTIONS=[['NW','Northwest'],['N','North'],['NE','Northeast'],['W','West'],['C','Current'],['E','East'],['SW','Southwest'],['S','South'],['SE','Southeast']];
const htmlEscape=esc;
function store(){localStorage.setItem(key,JSON.stringify(save));}
function currentForm(){return save.forms?.[save.activeForm]||save.form||null;}
function formComplete(f){return !!f&&Number(f.transformationStage??f.stage??0)>=23;}
function activeStats(){const f=currentForm();return formComplete(f)?f:save;}
function feedEntry(who,text){save.hub.feed.push({speaker:who,text,at:new Date().toISOString()});save.hub.feed=save.hub.feed.slice(-150);store();}
function safeText(value,fallback='Not recorded'){return value===undefined||value===null||value===''?fallback:String(value);}
const ATTRIBUTE_INFO={
Endurance:['Endurance','Internal · Resists combat fatigue and supports recovery after injury.'],
Fitness:['Fitness','External · Physical strength, grappling, forcing obstacles, resisting physical change.'],
Intuition:['Intuition','Internal · Detect ambushes, hidden items, deception and subtle environmental clues.'],
Reflexes:['Reflexes','External · Dodge danger, react quickly and determine turn priority.'],
Willpower:['Focus / Willpower','Internal · Resist mental pressure and Form influence; manage needs-related penalties.'],
Reasoning:['Reasoning','External · Logic, bargaining and arguing against restrictions.'],
Stability:['Stability','Internal · Maintain autonomy and resist Form control.'],
Presence:['Presence','External · Performance, grace, charisma and attracting attention.'],
Insight:['Insight','Internal · Understand motives and emotional cues; develop relationships.'],
Influence:['Influence','External · Persuasion, intimidation, negotiation and dialogue.']
};
function attributeValue(base,k){const label=ATTRIBUTE_INFO[k][0];const raw=base[label]??base[k]??base[k.toLowerCase()];return raw===undefined?null:Number(raw);}
function statRows(){const owner=activeStats(),base=owner.attributes||{};return ATTRS.map(k=>{const value=attributeValue(base,k);const mods=(owner.modifiers?.[k]||owner.modifiers?.[ATTRIBUTE_INFO[k][0]]||[]);const detail=mods.length?mods.map(m=>htmlEscape((m.source||'Modifier')+': '+(m.amount>=0?'+':'')+m.amount+(m.expires?' · expires '+m.expires:''))).join('<br>'):'No recorded modifiers';const shown=value===null?'Not recorded':value;return '<details class="stat-detail"><summary>'+htmlEscape(k)+' <b>'+shown+'</b></summary><p>'+htmlEscape(ATTRIBUTE_INFO[k][1])+'</p><p>Base: '+shown+'</p><p>'+detail+'</p><p class="muted small">Equipment, items and temporary effects appear when recorded by gameplay systems.</p></details>';}).join('');}
function drawerMarkup(type){const f=currentForm(),owner=activeStats(),loc=save.hub?.location||'Central Hub';if(type==='location')return '<h3>'+htmlEscape(loc)+'</h3><p>'+htmlEscape(safeText(locationDescription(),'Location description not yet recorded'))+'</p><h3>Discovered quests</h3><p>'+htmlEscape(safeText(atCherished()?'':save.hub?.discoveredQuests?.join(', '),'None recorded'))+'</p><h3>Discovered NPCs</h3><p>'+htmlEscape(safeText(knownNPCs().join(', '),'None recorded'))+'</p>';
if(type==='form')return '<h3>'+htmlEscape(safeText(f?.name,'No form equipped'))+'</h3><p>Transformation: '+(f?Math.min(23,Math.max(0,Number(f.transformationStage??f.stage??0)))+'/23':'Not applicable')+'</p><p>Relationship: '+(f?Math.max(-100,Math.min(100,Number(f.relationship??0))):'Not applicable')+' (−100 to +100)</p><p>Active attributes: '+(formComplete(f)?'Form':'Player')+'</p>'+['hunger','bladder','fatigue','currentActivity','desiredActivity','routine'].map(k=>'<div class="statrow"><span>'+htmlEscape(({currentActivity:'Current Activity',desiredActivity:'Desired Activity',routine:'Preferred Routine'})[k]||k[0].toUpperCase()+k.slice(1))+'</span><span>'+htmlEscape(safeText(f?.[k]??save[k]))+'</span></div>').join('');
if(type==='character')return '<p>Active baseline: '+(formComplete(f)?'Completed form':'Player')+'</p>'+['health','stamina','arousal'].map(k=>'<div class="statrow"><b>'+htmlEscape(k[0].toUpperCase()+k.slice(1))+'</b><span>'+htmlEscape(safeText(owner.baselines?.[k]??owner.stats?.[k]??owner[k]))+'</span></div>').join('')+statRows();
if(type==='quests')return '<h3>'+htmlEscape(safeText(save.quests?.active?.title,'First Steps'))+'</h3><p>'+htmlEscape(safeText(save.quests?.active?.description,'Speak with Eve at Central Hub. Survey nearby routes, discover Cherished Touch to the northeast, travel there, explore, and return to Eve.'))+'</p><p>Location: '+htmlEscape(safeText(save.quests?.active?.location,'Central Hub → Cherished Touch → Central Hub'))+'</p><p>Rewards: '+htmlEscape(safeText(save.quests?.active?.rewards,'100 gold · 50 EXP'))+'</p><p>Status: '+htmlEscape(safeText(save.quests?.active?.status,'Available — not yet accepted'))+'</p><button class="btn secondary" data-info="journal">Open quest journal</button> <button class="btn secondary" data-info="notes">Open quest notes</button>';
if(type==='path')return '<p>Current location: '+htmlEscape(loc)+'</p><div class="compass">'+DIRECTIONS.map(([id,label])=>'<div class="compass-cell"><small>'+label+'</small><div>'+htmlEscape(id==='C'?loc:id==='NE'&&!atCherished()&&save.world.discovered.cherishedTouch?'Cherished Touch':id==='SW'&&atCherished()?'Central Hub':safeText(save.hub?.routes?.[id],'Undiscovered'))+'</div></div>').join('')+'</div><div class="actions"><button class="btn secondary" data-info="survey">Survey nearby routes</button><button class="btn secondary" data-info="map">Open map</button></div>';
return '';}
function openDrawer(type){document.getElementById('drawer882')?.remove();const overlay=document.createElement('div');overlay.id='drawer882';overlay.className='v882-shade';const article=document.createElement('article');article.setAttribute('role','dialog');article.setAttribute('aria-label',type+' reference');const back=document.createElement('button');back.className='btn secondary';back.textContent='← Back to live feed';back.addEventListener('click',closeDrawer);article.append(back);const h=document.createElement('h2');h.textContent=({location:'◎ Location',form:'◈ Form',character:'♙ Stats',path:'⌁ Path',quests:'☷ Quests'})[type];article.append(h);const body=document.createElement('div');body.innerHTML=drawerMarkup(type);article.append(body);body.querySelectorAll('[data-info]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.info==='map'){closeDrawer();screen='map';render();}else if(b.dataset.info==='survey'){closeDrawer();surveyRoutes();render();}else if(b.dataset.info==='travel-cherished'){closeDrawer();travelCherished();}else if(b.dataset.info==='travel-hub'){closeDrawer();travelHub();}else if(b.dataset.info==='charity'){closeDrawer();interactCharity('');render();}else{const note=document.createElement('p');note.textContent='This gameplay action is not yet connected in the modular rebuild.';body.append(note);}}));const backdrop=document.createElement('div');backdrop.style.flex='1';backdrop.addEventListener('click',closeDrawer);overlay.append(article,backdrop);document.body.append(overlay);}
function render(){nav();const app=document.getElementById('app'),a=save.attributes||{},appearance=save.appearance||{};save.hub=save.hub||{location:'Central Hub',feed:[]};let body='';
if(screen==='play'){body='<div class="v882-shell"><div class="v882-head"><strong>'+htmlEscape(save.hub.location||'Central Hub')+'</strong><small>'+htmlEscape(safeText(save.hub.gameTime,'In-game time not yet available'))+' · '+htmlEscape(safeText(save.hub.currentAppearance||save.name))+'</small><div class="location-image" aria-label="Location image pending">Location image not yet available</div></div><nav class="v882-tools" aria-label="Quick reference">'+[['location','◎ Location'],['form','◈ Form'],['character','♙ Stats'],['path','⌁ Path'],['quests','☷ Quests']].map(([id,label])=>'<button data-drawer="'+id+'">'+label+'</button>').join('')+'</nav><div class="v882-feed"><section class="v815-live" id="liveFeed" aria-label="Live roleplay feed"><div class="v815-title">Live Feed</div></section><div class="v815-status">◈ A.S.S. CONNECTED · '+htmlEscape(save.name)+'</div><details class="v815-history"><summary>Previous turns · History</summary><div id="turnHistory"></div></details></div></div><form class="v815-compose" id="compose"><div class="v815-channels" id="channels">'+[['world','Location'],['npc','NPC'],['players','Player'],['form','Form']].map(([id,label])=>'<button type="button" data-channel="'+id+'">'+label+'</button>').join('')+'</div><div id="recipientRow" class="recipient-row" hidden><label for="recipientInput">Recipient</label><input id="recipientInput" type="text" placeholder="NPC or player name"></div><div class="v815-input"><label for="actionInput" class="v815-input-label">What do you do or say?</label><textarea id="actionInput" placeholder="Describe your action or dialogue…" rows="2"></textarea><button class="btn" type="submit">Send →</button></div></form>';}
else if(screen==='settings')body='<div class="eyebrow">EPI-CENTER // SETTINGS</div><h1 class="title">Settings</h1><section class="card"><h3>Session</h3><p class="muted">Your current character is saved locally in Slot '+slot+'. Log Out returns to the title screen without deleting the save.</p><button class="btn" id="logoutButton" type="button">Log Out · Return to Title</button></section>'; 
else if(screen==='character')body='<div class="eyebrow">IDENTITY // RECORD</div><h1 class="title">'+htmlEscape(save.name)+'</h1><div class="grid">'+Object.entries(a).map(([k,v])=>'<div class="card"><h3>'+htmlEscape(k)+'</h3><div class="stat">'+htmlEscape(v)+'</div></div>').join('')+'</div><section class="card"><h3>Original appearance</h3>'+Object.entries(appearance).filter(([k,v])=>String(v).trim()).map(([k,v])=>'<div class="listitem"><b>'+htmlEscape(k)+'</b><span>'+htmlEscape(v)+'</span></div>').join('')+'</section>';
else body='<div class="eyebrow">EPI-CENTER // '+htmlEscape(screen.toUpperCase())+'</div><h1 class="title">'+htmlEscape(tabs.find(x=>x[0]===screen)[2])+'</h1><div class="card"><p class="muted">This gameplay section is awaiting migration. Existing save data is preserved.</p></div>';
app.innerHTML=body;
if(screen!=='play'){document.getElementById('logoutButton')?.addEventListener('click',logout);const ret=document.createElement('button');ret.className='btn secondary';ret.textContent='Return to Play';ret.addEventListener('click',()=>{screen='play';render();});app.append(ret);return;}
const feed=document.getElementById('liveFeed'),history=document.getElementById('turnHistory');for(const m of save.hub.feed||[]){const d=document.createElement('div');d.className='msg';const b=document.createElement('b');b.textContent=(m.at?new Date(m.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+' · ':'')+(m.speaker||'A.S.S.');const t=document.createElement('div');t.textContent=m.text||'';d.append(b,t);feed.append(d);const h=document.createElement('p');h.textContent=(m.speaker||'A.S.S.')+': '+(m.text||'');history.append(h);}if(!(save.hub.feed||[]).length){const p=document.createElement('p');p.className='muted';p.textContent='No live messages recorded yet.';feed.append(p);}feed.scrollTop=feed.scrollHeight;
const input=document.getElementById('actionInput'),recipient=document.getElementById('recipientInput'),recipientRow=document.getElementById('recipientRow');save.hub.channel=save.hub.channel||'world';input.value=save.hub.actionDraft||'';recipient.value=save.hub.recipientDraft||'';function updateChannel(){recipientRow.hidden=!['npc','players'].includes(save.hub.channel);document.querySelectorAll('[data-channel]').forEach(b=>b.classList.toggle('active',b.dataset.channel===save.hub.channel));}updateChannel();document.querySelectorAll('[data-channel]').forEach(b=>b.addEventListener('click',()=>{save.hub.channel=b.dataset.channel;store();updateChannel();}));input.addEventListener('input',()=>{save.hub.actionDraft=input.value;store();});recipient.addEventListener('input',()=>{save.hub.recipientDraft=recipient.value;store();});document.getElementById('compose').addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text)return;if(['npc','players'].includes(save.hub.channel)&&!recipient.value.trim()){recipient.focus();return;}if(save.hub.channel==='npc'&&atCherished()&&recipient.value.trim().toLowerCase()==='charity'){feedEntry(save.name+' → Charity',text);interactCharity(text);save.hub.actionDraft='';store();render();return;}const who=save.name+' · '+({world:'Location',npc:'NPC',players:'Player',form:'Form'})[save.hub.channel]+(recipient.value.trim()?' → '+recipient.value.trim():'');feedEntry(who,text);save.hub.actionDraft='';store();render();});app.querySelectorAll('[data-drawer]').forEach(b=>b.addEventListener('click',()=>openDrawer(b.dataset.drawer)));}

render();
</script></body></html>
