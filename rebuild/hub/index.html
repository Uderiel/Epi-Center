function kibblesToolAction(action){if(save.encounter?.active&&action!=='treats')return 'Finish the active encounter before changing this fixture.';let message;if(action==='mastered'||action==='unmastered'){EpiKibblesForm.grant(save,{mastered:action==='mastered'});message=EpiKibblesForm.label(save)+' set '+action+'. No healing, transformation or influence increase applied.';}else if(action==='treats'){save.inventory||={};save.inventory.dogTreats=EpiKibblesForm.treats(save)+1;if(save.encounter)save.encounter.dogTreats=save.inventory.dogTreats;message='Added one dog treat. Inventory now contains '+save.inventory.dogTreats+'.';}else if(action==='help'){save.devKibblesHelp=!save.devKibblesHelp;message='Help-seeking simulation '+(save.devKibblesHelp?'enabled':'disabled')+' for the next encounter.';}else return 'Unknown Kibbles test control.';feedEntry('Developer QA',message);store();return message;}

function equipmentMarkup(){const f=EpiKibblesForm.ensure(save),worn=EpiKibblesForm.equipped(save);return '<h1 class="title">Equipment & Forms</h1>'+erinEquipmentMarkup()+'<section class="card"><h3>Skinsuit · '+htmlEscape(EpiKibblesForm.label(save))+' (German Shepherd)</h3><p>'+(f?'Owned · '+(f.mastered?'Mastered':'Unmastered'):'Not discovered / not mastered')+' · '+(worn?'Currently canine':'Not currently worn')+'</p><p>Inventory ID: German Shepherd Skinsuit · Common living form · '+(f?.personalization?.gender==='male'?'Male':'Female')+' German Shepherd.</p><p>'+(worn?(f.mastered?'Will-based removal available. Player retains control.':'Sealed and unmastered. Internal escape routes remain to be designed.'):'Mastered equip applies the full form immediately.')+' No zipper or seam.</p>'+formIdentityMarkup()+'<div class="actions"><button class="btn" id="equipKibbles" '+(!f?.mastered||worn||save.encounter?.active||save.activeForm||(save.encounter?.anatomy&&EpiEncounterRules.progress(save.encounter.anatomy)>0&&!save.encounter.outcome?.mastery)?'disabled':'')+'>Equip Kibbles</button><button class="btn secondary" id="releaseKibbles" '+(!worn||!f?.mastered||save.encounter?.active?'disabled':'')+'>Unequip Kibbles · Will release</button></div>'+(f?'<details><summary>Form information · resources, attributes and appearance</summary><p>Health '+f.resources.health+'/80 · Stamina '+f.resources.stamina+'/120 · Resolve '+f.resources.resolve+'/70. Arousal treatment remains undefined.</p><p>Moves: Bite, Pouncing Bite, Grapple, Skin Wrap, Defensive Posture; Analyze, Wriggle Free, mental resistance; Quick Sidestep and Counterbite.</p><p>Four-legged gait; paws cannot grip humanoid tools; public voice is canine. Private thoughts remain your own.</p>'+appearanceMarkup(f.attributes)+appearanceMarkup(f.appearance)+'<p class="small">Restored source: '+htmlEscape(f.source)+'</p></details>':'')+'</section><section class="card"><h3>Other equipment</h3><p>Additional equipment migration is pending. Existing records are preserved.</p></section>';}
function inventoryMarkup(){const crate=EpiHangryFangs.atCrate(save)&&EpiHangryFangs.record(save).crateStage>=2&&!EpiHangryFangs.mastered(save),why=crate?(EpiKibblesForm.treats(save)?'':'No dog snacks in inventory.'):'Use snacks at the examined crate or from the encounter Inventory tab.';return '<h1 class="title">Items</h1>'+erinEquipmentMarkup()+'<section class="card"><h3>Gold · '+Number(save.gold||0)+'</h3><h3>Dog snacks · '+EpiKibblesForm.treats(save)+'</h3><p>Pet Boutique: 5 gold each. Use one at the crate to feed Kibbles without combat, or use one Minor in combat while your hands are usable.</p><button class="btn" data-hangry="feed" '+(!crate||why||save.encounter?.active?'disabled':'')+'>Offer dog snack at crate</button><p>'+htmlEscape(why)+'</p>'+(!crate&&!EpiKibblesForm.canFeed(save)?'<button class="btn secondary" id="feedKibbles">Feed present Kibbles</button>':'')+'</section><section class="card"><h3>Tier Mastery XP · '+Number(save.inventory?.tierMasteryXP||0)+'</h3><button class="btn" data-hangry="xp-menu">Apply Tier Mastery XP to a form</button>'+(xpMenuOpen?'<form id="tierXPForm"><label>Owned form<select id="tierXPFormId" required>'+Object.entries(save.forms||{}).filter(([,f])=>f.owned!==false).map(([id,f])=>'<option value="'+htmlEscape(id)+'">'+htmlEscape(f.itemName||f.name||id)+' · '+Number(f.tierMasteryXP||0)+' XP assigned</option>').join('')+'</select></label><label>XP amount<input id="tierXPAmount" type="number" min="1" max="'+Number(save.inventory?.tierMasteryXP||0)+'" value="'+Number(save.inventory?.tierMasteryXP||0)+'" required></label><button class="btn" '+(save.encounter?.active?'disabled':'')+'>Assign XP</button></form>':'')+'<p>Assigned XP is saved on that form. Tier upgrades await the tier/rarity cost design.</p></section><section class="card"><h3>Neko Cafe coupons · '+Number(save.inventory?.nekoCafeCoupons||0)+'</h3><p>Each coupon is good for 50% off one item, one use. Redemption will be available when Neko Cafe purchasing is built.</p></section>';}
function bindEquipment(){document.querySelectorAll('[data-preview-gender]').forEach(button=>button.addEventListener('click',()=>{const select=document.getElementById('kibblesGender');select.value=button.dataset.previewGender;select.dispatchEvent(new Event('change'));}));document.getElementById('kibblesGender')?.addEventListener('change',e=>{const gender=e.target.value;document.querySelectorAll('[data-preview-gender]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.previewGender===gender)));const summary=document.getElementById('kibblesPreviewSummary');if(summary){const p=EpiKibblesForm.profile(gender);summary.textContent=gender?p.gender+' preview · '+p.height+' · '+p.weight+'. Save identity to make this choice permanent.':'Preview either portrait before saving. Your choice is not permanent until you save.';}});document.getElementById('kibblesIdentityForm')?.addEventListener('submit',e=>{e.preventDefault();try{EpiKibblesForm.personalize(save,{name:document.getElementById('kibblesName').value,gender:document.getElementById('kibblesGender').value});feedEntry('A.S.S.',EpiKibblesForm.label(save)+' · '+save.forms.kibbles.personalization.gender+' identity saved permanently. This name and gender stay with the same physical form.');store();render();document.getElementById('app').scrollTop=0;}catch(error){document.getElementById('identityFeedback').textContent=error.message;}});document.getElementById('equipKibbles')?.addEventListener('click',()=>{try{EpiKibblesForm.equip(save);feedEntry('A.S.S.',EpiKibblesForm.label(save)+' equipped. Your body becomes a '+(save.forms.kibbles.personalization?.gender==='male'?'male':'female')+' German Shepherd: muzzle and canine throat, forepaws and hind paws, four-legged posture, double coat and tail. Kibbles attributes, remaining resources and techniques are active; your original profile is preserved.');}catch(e){feedEntry('A.S.S.',e.message);}store();render();});document.getElementById('feedKibbles')?.addEventListener('click',()=>{try{feedEntry('Kibbles',EpiKibblesForm.feed(save));if(save.encounter?.origin===EpiHangryFangs.ID)EpiHangryFangs.outcome(save,{origin:EpiHangryFangs.ID,outcome:{mastery:true,outcome:'dog-treat-mastery'}});}catch(e){feedEntry('A.S.S.',e.message);}store();render();});}
function handleBodyIntent(text){const channel=save.hub.channel;if(channel==='form'&&EpiErin.present(save)){feedEntry(save.name+' · Private thought to Erin',text);feedEntry('Erin · Private',EpiErin.dialogue(save,text));return true;}if(channel==='world'&&!save.encounter?.active&&EpiHangryFangs.atCrate(save)){const q=EpiHangryFangs.record(save);if(/(?:inspect|examine|look.*closer|look.*at).*(?:crate)/i.test(text)&&q.crateStage<2){feedEntry('World',EpiHangryFangs.examine(save));return true;}if(q.crateStage>=2&&!/\b(?:not|never|don.t|won.t|do not)\b/i.test(text)&&/(?:whistle|call.*(?:dog|out)|approach|move.*closer|open.*crate|examine.*crate|look.*closer|come here|here (?:boy|girl|dog)|psst|hey dog)/i.test(text)){startKibbles(true);return true;}}if(channel==='world'&&isWaitIntent(text)){waitGameHour();return true;}if(channel==='world'&&!save.encounter?.active&&isInspectionIntent(text)){inspectLocation();return true;}const c=EpiKibblesForm.capabilities(save);if(channel==='world'&&save.encounter?.active&&/^(move toward help|call for help)[.!]?$/i.test(text)){encounterAction(/^move/i.test(text)?'Move toward help':'Call for help');return true;}const response=EpiKibblesText.resolve(save,text,{channel,location:save.hub.location,description:locationDescription(),recipient:save.hub.recipientDraft});if(response){if(response.private)feedEntry(save.name+' · Private thought to '+EpiKibblesForm.label(save),text);feedEntry(EpiKibblesForm.label(save)+(response.private?' · Private':''),response.text);return true;}if(channel!=='form'&&!c.speech){feedEntry('Your altered voice','Barks, whines and gestures emerge instead of intelligible human words. The intended words remain private; no NPC quest dialogue or reward is triggered.');return true;}return false;}

const APPEARANCE_LABELS={age:'Age',gender:'Gender',footSize:'Feet',legs:'Legs',hips:'Hips',buttocks:'Buttocks',waist:'Waist & abdomen',back:'Back & shoulders',chest:'Chest',arms:'Arms',hands:'Hands',fingers:'Fingers',voice:'Neck & voice',face:'Face',eyes:'Eyes',ears:'Ears',hair:'Scalp hair / fur',skin:'Skin',genitalAnatomy:'Genital anatomy',scent:'Scent & physiology',height:'Height',weight:'Weight',build:'Build',tail:'Tail'};
function pairedAppearanceMarkup(){const original=save.appearance||{},current=EpiErin.body(save,EpiKibblesForm.body(save)),keys=[...new Set([...Object.keys(APPEARANCE_LABELS),...Object.keys(original),...Object.keys(current)])];return '<div class="appearance-fields">'+keys.map(k=>'<section class="appearance-field" data-appearance-field="'+htmlEscape(k)+'"><h4>'+htmlEscape(APPEARANCE_LABELS[k]||k)+'</h4><p class="appearance-original"><span>Original Appearance:</span><span>'+htmlEscape(safeText(original[k],'Not specified'))+'</span></p><p class="appearance-current"><span>Current Appearance:</span><span>'+htmlEscape(safeText(current[k],'Not specified'))+'</span></p></section>').join('')+'</div>';}
function portraitMarkup(preview=false){if(!preview&&!EpiKibblesForm.equipped(save))return '';const f=EpiKibblesForm.ensure(save);if(!f)return '';return '<figure class="form-portrait"><img '+(preview?'id="kibblesPortrait" ':'')+'src="'+EpiKibblesForm.portrait(save)+'" alt="'+htmlEscape((f.personalization?.gender==='male'?'Male':'Female')+' German Shepherd · '+EpiKibblesForm.label(save))+'" width="1100" height="733"><figcaption>'+htmlEscape(EpiKibblesForm.label(save))+' · '+(preview?'Form portrait':'Current appearance')+'</figcaption></figure>';}
function appearancePanel(){return '<div class="eyebrow">CURRENT BODY // APPEARANCE</div><h1 class="title">Appearance</h1><section class="card"><h3>Current appearance · '+htmlEscape(EpiKibblesForm.equipped(save)?EpiKibblesForm.label(save):save.name)+'</h3>'+portraitMarkup()+pairedAppearanceMarkup()+'</section>';}
function genderPreviewMarkup(){return '<div class="gender-previews" role="group" aria-label="Preview Kibbles gender">'+['male','female'].map(gender=>{const p=EpiKibblesForm.profile(gender);return '<button type="button" class="gender-preview" data-preview-gender="'+gender+'" aria-pressed="false" aria-label="Preview '+p.gender+' Kibbles"><img src="'+p.portrait+'" alt="'+p.gender+' German Shepherd photograph" width="1100" height="733"><strong>'+p.gender+'</strong><span>'+p.height+'</span><span>'+p.weight+'</span></button>';}).join('')+'</div><p id="kibblesPreviewSummary" role="status" aria-live="polite">Preview either portrait before saving. Your choice is not permanent until you save.</p>';}
function formIdentityMarkup(){const f=EpiKibblesForm.ensure(save);if(!f)return '';if(f.personalization)return '<p class="identity-saved" role="status">Identity saved permanently: <strong>'+htmlEscape(f.personalization.name)+'</strong> · '+htmlEscape(f.personalization.gender)+'. Name and gender cannot be changed.</p>'+portraitMarkup(true);if(f.mastered)return '<form id="kibblesIdentityForm" class="form-identity"><h4>Set your mastered form identity · one time</h4><p>Preview both portraits, then choose a name and gender. Saving makes both permanent for this form.</p>'+genderPreviewMarkup()+'<label for="kibblesName">Form name</label><input class="field" id="kibblesName" maxlength="24" required autocomplete="off"><label for="kibblesGender">Kibbles gender</label><select class="field" id="kibblesGender" required><option value="">Choose male or female</option><option value="female">Female</option><option value="male">Male</option></select><button class="btn" type="submit">Save form identity · One time</button><p id="identityFeedback" role="status" aria-live="polite"></p></form>';return portraitMarkup(true);}



function inspectLocation(){if(save.encounter?.active){feedEntry('A.S.S.','Finish the encounter before inspecting the wider location.');return;}advanceGameTime(EpiWorldClock.COSTS.inspect,'Inspect surroundings');feedEntry('World',(EpiErin.inside(save)?locationDescription():EpiHubWorld.inspect(save)+' '+EpiErin.discoverHeels(save)+' '+EpiHangryFangs.inspectArea(save))+' (1 minute)');}
function locationFeaturesMarkup(){const features=save.world.examined?.[save.hub.location]?EpiHubWorld.features(save):[];return (features.length?'<h3>Surroundings</h3><ul>'+features.map(x=>'<li>'+htmlEscape(x)+'</li>').join('')+'</ul>':'')+'<button class="btn secondary" data-info="inspect">Inspect surroundings</button>';}
let mapSelection=null,mapZoom=1;
function mapMarkup(){const current=save.hub.location,routes=availablePathRoutes(),knowledge=EpiHubWorld.knowledge(save),candidate=EpiHubWorld.node(mapSelection),selected=candidate&&knowledge.known.has(candidate.id)?candidate:EpiHubWorld.node(current),route=routes.find(r=>r.id===selected?.id);const cells=[];for(let y=-5;y<=5;y++)for(let x=-5;x<=5;x++){const n=EpiHubWorld.worldNodes.find(n=>n.x===x&&n.y===y);if(!n||!knowledge.known.has(n.id)){cells.push('<div class="district-fog" aria-hidden="true" style="grid-column:'+(x+6)+';grid-row:'+(y+6)+'"></div>');continue;}const here=n.id===current,reachable=routes.some(r=>r.id===n.id),visited=knowledge.visited.has(n.id);cells.push('<button type="button" class="district-node '+(visited?'kind-'+n.kind:'')+(here?' is-here':'')+(reachable?' is-reachable':'')+(selected?.id===n.id?' is-selected':'')+'" style="grid-column:'+(x+6)+';grid-row:'+(y+6)+'" data-map-location="'+htmlEscape(n.id)+'" aria-label="'+htmlEscape(locationName(n.id)+(here?' · You are here':visited?' · Explored':' · Nearby'))+'" '+(here?'aria-current="location"':'')+'><span>'+htmlEscape(locationName(n.id))+'</span></button>');}return '<div class="eyebrow">WORLD // EPI-CENTER</div><h1 class="title">Map</h1><section class="card district-map"><div class="map-heading"><h2>Explored district</h2><span>↑ North</span></div><p>Current location: <strong>'+htmlEscape(locationName(current))+'</strong></p><p class="small muted">Explored places and their neighboring names remain on your map. Unexplored territory is covered by fog. Examine a location to learn its details.</p><div class="map-controls"><button class="btn secondary" data-map-zoom="1">Fit map</button><button class="btn secondary" data-map-zoom="2">2×</button><button class="btn secondary" data-map-zoom="3">3×</button></div><div class="district-map-scroll" data-map-scale="'+mapZoom+'" tabindex="0" aria-label="Scrollable explored district map"><div class="district-map-grid" style="width:'+mapZoom*100+'%;--map-zoom:'+mapZoom+'" role="group" aria-label="Explored district with fog of war">'+cells.join('')+'</div></div><div class="map-key"><span>● Current</span><span>◇ Direct path</span><span>Dark areas: unexplored</span></div><section class="map-selection" aria-live="polite"><h3>'+htmlEscape(locationName(selected?.id||current))+'</h3><p>'+htmlEscape(save.world.examined?.[selected?.id]?(selected.id===EpiHubWorld.STORE?CHERISHED_DESCRIPTION:EpiHubWorld.description(selected.id)):'Examine this location to learn its details.')+'</p>'+(selected?.id===current?'<p>You are here.</p>':route?'<button class="btn" data-world-route="'+htmlEscape(route.id)+'" '+(save.encounter?.active?'disabled':'')+'>Travel '+route.direction+' · '+htmlEscape(locationName(route.id))+'</button>':'<p>Follow connecting paths to reach this location.</p>')+'</section><p class="small muted">Path shows adjacent moves. Alleys have no direct entrances to neighboring buildings. Travel takes 8 minutes and returns to the live feed.</p></section>';}

function bindMap(){document.querySelectorAll('#app [data-map-location]').forEach(b=>b.addEventListener('click',()=>{const view=document.querySelector('.district-map-scroll'),scroll=[view.scrollLeft,view.scrollTop];mapSelection=b.dataset.mapLocation;render();const next=document.querySelector('.district-map-scroll');next.scrollLeft=scroll[0];next.scrollTop=scroll[1];}));document.querySelectorAll('[data-map-zoom]').forEach(b=>b.addEventListener('click',()=>{mapZoom=Number(b.dataset.mapZoom);render();}));document.querySelectorAll('#app [data-world-route]').forEach(b=>b.addEventListener('click',()=>travelPath(b.dataset.worldRoute)));}



function advanceGameTime(minutes,reason){const before=EpiWorldClock.label(save);EpiWorldClock.advance(save,minutes);const d=devState();d.minutes=EpiWorldClock.view(save).elapsed;for(const k of Object.keys(DEV_NEEDS_RATES))d.needs[k]=devClamp(d.needs[k]+minutes*DEV_NEEDS_RATES[k],0,100);save.hub.gameTime=EpiWorldClock.label(save);save.worldClock.lastAdvance={minutes,reason,from:before,to:save.hub.gameTime};for(const text of EpiErin.advance(save,minutes))feedEntry('Physical transformation',text);}
function isInspectionIntent(text){return /^(?:i\s+)?(?:search(?:\s+(?:the\s+)?(?:area|location|surroundings))?|look around|inspect surroundings|survey surroundings)[.!]?$/i.test(text.trim());}
function isWaitIntent(text){return /^(?:i\s+)?wait\s+(?:one|1|an)\s+hour[.!]?$/i.test(text.trim());}
function waitGameHour(){if(save.encounter?.active){feedEntry('A.S.S.','Finish the encounter before waiting an hour.');return;}advanceGameTime(EpiWorldClock.COSTS.wait,'Wait one hour');feedEntry('Time','You wait one hour. '+EpiWorldClock.label(save)+'.');}
document.addEventListener('click',e=>{if(e.target.closest?.('[data-wait-hour]')){closeDrawer();waitGameHour();store();render();}});
function clockControlsMarkup(){return '<div class="world-clock-tools"><span>Travel 8 min · Inspect 1 min · Conversation 2 min</span><button class="btn secondary" data-wait-hour '+(save.encounter?.active?'disabled':'')+'>Wait one hour</button></div>';}
function locationArtworkMarkup(){const phase=EpiWorldClock.phase(save),art=EpiHubArt.path(save.hub.location,phase);if(!art)return atCherished()?'<div class="location-image">Cherished Touch image pending</div>':'';return '<div class="location-image" aria-label="Location image"><button type="button" class="location-art-open" id="openHubArt" aria-label="View full '+htmlEscape(save.hub.location)+' artwork"><img src="'+art+'" alt="'+htmlEscape(save.hub.location)+' · '+(phase==='day'?'Daytime':'Nighttime')+'" width="1100" height="733"></button><small>'+htmlEscape(save.hub.location)+' · '+(phase==='day'?'Daytime':'Nighttime')+' · Tap to view full image</small></div>';}


let xpMenuOpen=false;
function hangryMarkup(){const q=EpiHangryFangs.record(save);if(q.status==='available'||q.rewarded)return '';return '<section class="card"><h3>Hangry Fangs</h3>'+(q.briefed?'<p>Difficulty: Risky</p><p>'+htmlEscape(EpiHangryFangs.DESCRIPTION)+'</p><p>Target: NE Alley Crate</p><p>Rewards: '+htmlEscape(EpiHangryFangs.REWARDS)+'</p>':'')+'<p>Report to Eve at Central Hub Spire upon success.</p>'+(q.briefed?'<p>'+(q.masteryRecorded?'Mastery obtained. Return to Eve after releasing the canine form.':'Resolve the lone canine situation.')+'</p>':'')+(q.status==='offered'?'<button class="btn" data-hangry="accept">Accept Hangry Fangs</button>':'')+'</section>';}
function questActionsMarkup(){const q=EpiHangryFangs.record(save),atSpire=save.hub.location===EpiHubWorld.SPIRE;let buttons='';if(atSpire&&q.status==='offered')buttons+='<button class="btn" data-hangry="accept">Accept Hangry Fangs</button>';if(atSpire&&q.masteryRecorded&&!q.rewarded)buttons+='<button class="btn" data-hangry="report" '+(EpiHangryFangs.blocked(save)?'disabled':'')+'>Report Hangry Fangs to Eve</button>';if(EpiHangryFangs.atCrate(save)&&q.crateStage&&!EpiHangryFangs.mastered(save)&&!save.encounter?.active){buttons+='<button class="btn secondary" data-hangry="examine">Examine crate</button>';if(q.crateStage>=2)buttons+='<button class="btn" data-hangry="approach">Approach / call the dog</button><button class="btn secondary" data-hangry="inventory">Open inventory · Dog snack</button>';}if(save.hub.location===EpiHangryFangs.PET&&save.world.examined?.[save.hub.location])buttons+='<p>Dog snacks · 5 gold each. Gold: '+Number(save.gold||0)+'</p><button class="btn" data-hangry="buy">Buy dog snack · 5 gold</button>';return buttons?'<section class="quest-actions">'+buttons+'</section>':'';}
function hangryAction(action){try{if(action==='accept'){const result=EpiHangryFangs.accept(save);advanceGameTime(2,'Eve conversation');feedEntry('Eve',result);}if(action==='report'){const result=EpiHangryFangs.report(save);advanceGameTime(2,'Eve conversation');feedEntry('Eve',result);}if(action==='examine'){advanceGameTime(1,'Examine crate');feedEntry('World',EpiHangryFangs.examine(save));}if(action==='approach'){startKibbles(true);return;}if(action==='inventory')screen='inventory';if(action==='feed'){feedEntry('Kibbles',EpiHangryFangs.feedCrate(save));screen='play';}if(action==='buy')feedEntry('Pet Boutique',EpiHangryFangs.buySnack(save));if(action==='xp-menu')xpMenuOpen=!xpMenuOpen;}catch(e){feedEntry('A.S.S.',e.message);}store();render();}
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-hangry]');if(b&&!b.disabled){closeDrawer();hangryAction(b.dataset.hangry);}});
document.addEventListener('change',e=>{if(e.target.id==='devShowLocationRefs'){save.devShowLocationRefs=e.target.checked;store();render();}});
document.addEventListener('submit',e=>{if(e.target.id==='tierXPForm'){e.preventDefault();try{feedEntry('Tier Mastery',EpiHangryFangs.allocateXP(save,document.getElementById('tierXPFormId').value,document.getElementById('tierXPAmount').value));}catch(error){feedEntry('A.S.S.',error.message);}store();render();}});


EpiErin.state(save);EpiKibblesForm.ensure(save);store();render();
</script></body></html>
