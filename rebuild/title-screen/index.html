<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Epi-Center — Title Screen</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#fff;background:#080b17}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#080b17}main{position:relative;min-height:100dvh;isolation:isolate;padding:clamp(18px,3vw,38px);display:flex;flex-direction:column;justify-content:flex-end}main:before{content:'';position:absolute;inset:0;z-index:-2;background-image:url('./assets/epi-center-approved-banner.png');background-position:center top;background-size:cover}main:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(4,4,15,.95),rgba(4,4,15,.3) 55%,rgba(4,4,15,.03))}h1{font-family:Georgia,serif;font-size:clamp(2.4rem,8vw,6rem);letter-spacing:.08em;text-align:center;color:#f9cfa0;text-shadow:0 3px 1px #541e68,0 0 18px #f400d9;margin:0}.tagline{text-align:center;letter-spacing:.2em;font-size:clamp(.75rem,2vw,1.15rem);margin:6px 0 auto;text-transform:uppercase;text-shadow:0 2px 5px #000}header{margin-bottom:auto}#slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(100%,900px);margin:0 auto}.slot{background:#090d19ed;border:1px solid #c99a5c;border-radius:12px;padding:15px;text-align:center;box-shadow:0 5px 30px #0009}.slot h2{font-size:clamp(.78rem,1.5vw,1rem);color:#f2c58c}.slot p{min-height:2.5em;color:#e1d6df;font-size:.85rem}.actions{display:flex;flex-direction:column;gap:8px}button{font:inherit;border:1px solid #c880b7;border-radius:9px;background:#74194d;color:white;padding:12px;min-height:44px;cursor:pointer}button:focus-visible{outline:3px solid #fff}button.danger{background:#351622}footer{text-align:center;margin-top:18px;font-size:.8rem;color:#ddd}#notice{text-align:center;min-height:1.5em;color:#fff}dialog{background:#131020;color:white;border:1px solid #c99a5c;border-radius:12px;max-width:90vw}dialog::backdrop{background:#000b}menu{display:flex;gap:8px;justify-content:flex-end;padding:0}@media(max-width:580px){main:before{background-position:60% top}#slots{grid-template-columns:1fr;max-width:360px}.slot{padding:9px}.slot p{min-height:0;margin:5px}.slot h2{margin:3px}header{margin-bottom:22vh}main{justify-content:flex-start}}
</style></head><body><main><header><h1>EPI-CENTER</h1><p class="tagline">Where choice... is only the beginning.</p></header><section id="slots" aria-label="Save slots"></section><p id="notice" role="status" aria-live="polite"></p><footer>v1.0.8 · Foundation · Community links coming later</footer></main><dialog id="confirm"><form method="dialog"><h2>Delete saved character?</h2><p id="confirm-text"></p><menu><button value="cancel">Cancel</button><button value="delete" class="danger">Delete slot</button></menu></form></dialog><script>
/* v1.0.4 — Inline controller deliberately avoids stale cached external modules. */
(function(){
 const host=document.getElementById('slots'),notice=document.getElementById('notice'),dialog=document.getElementById('confirm'),confirmText=document.getElementById('confirm-text');
 const key=id=>'epicenter_v1_slot_'+id;
 function read(id){const raw=localStorage.getItem(key(id));if(raw===null)return null;try{const s=JSON.parse(raw);return s&&s.schema===1&&s.slot===id&&['draft','ready'].includes(s.status)?s:{status:'corrupt'};}catch{return {status:'corrupt'};}}
 function show(message){notice.textContent=message;}
 function render(){
  host.replaceChildren();
  for(let id=1;id<=3;id++){
   const slot=read(id),section=document.createElement('section');section.className='slot';
   const heading=document.createElement('h2');heading.textContent='Save Slot '+id;
   const detail=document.createElement('p');detail.textContent=slot===null?'Empty':slot.status==='corrupt'?'Unreadable save — recovery required':slot.status==='draft'?'Character creation not started':'Ready to play';
   const actions=document.createElement('div');actions.className='actions';
   function button(label,callback,cls){const b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.addEventListener('click',callback);actions.append(b);}
   if(slot===null)button('New Character',()=>{
    try{
     if(localStorage.getItem(key(id))!==null){render();show('Slot was already created. Select Continue.');return;}
     const now=new Date().toISOString();localStorage.setItem(key(id),JSON.stringify({schema:1,slot:id,status:'draft',name:'',createdAt:now,updatedAt:now}));
     render();location.href='../character-creation/?slot='+id+'&v=1.0.8';
    }catch(e){show('Unable to create slot: '+e.message);render();}
   });
   else if(slot.status==='corrupt')button('Preserve for recovery',()=>show('Unreadable save preserved. No automatic deletion.'));
   else{
    button('Continue',()=>{location.href='../character-creation/?slot='+id+'&v=1.0.8';});
    button('Delete',()=>{
     confirmText.textContent='Delete Slot '+id+'? This cannot be undone.';
     dialog.showModal();
     dialog.addEventListener('close',()=>{if(dialog.returnValue==='delete'){try{localStorage.removeItem(key(id));render();show('Slot '+id+' deleted.');}catch(e){show('Delete failed: '+e.message);}}},{once:true});
    },'danger');
   }
   section.append(heading,detail,actions);host.append(section);
  }
 }
 function refresh(){try{render();}catch(e){show('Unable to refresh save slots: '+e.message);}}
 window.addEventListener('pageshow',refresh);
 window.addEventListener('focus',refresh);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
 refresh();
})();
</script></body></html>
